#River core/bank size, measured on the 'downhillrivers:river_line' noise.
#riverCoreThreshold = half-width of the open water channel. Increase for wider rivers.
#bankWidth = how far the banks extend past the water on each side (added to riverCoreThreshold).
#riverLineAmplitude = amplitude of the underlying river_line noise (default 1.0).
#  Lowering this compresses the noise toward zero, so the same thresholds cover a larger
#  portion of the noise field -> rivers become more frequent and closer together (smaller, windier).
#  Raising it spreads rivers further apart.
#riverLineFirstOctave = scale of the river_line noise (default -10).
#  More negative = larger, more widely-spaced river curves.
#  Less negative (closer to 0) = smaller, more frequent, windier curves
#  -- but values above about -7 may break rivers into disconnected blobs.
#riverDepth = how many blocks deep the river channel is carved below the surface water layer.
#  0 disables depth carving entirely (rivers stay exactly 1 block deep).
#  The feature scans for river_water blocks and fills downward through solid terrain.
#  Stops early if it hits air or a cave.
[river_shape]
	# Default: 0.006
	# Range: 0.0 ~ 1.0
	riverCoreThreshold = 0.006
	# Default: 0.009
	# Range: 0.0 ~ 1.0
	bankWidth = 0.009
	# Default: 1.0
	# Range: 0.05 ~ 5.0
	riverLineAmplitude = 1.0
	# Default: -10
	# Range: -16 ~ -4
	riverLineFirstOctave = -10
	# Default: 0
	# Range: 0 ~ 32
	riverDepth = 0

#River bank block zones, based on the 'downhillrivers:river_bank' noise.
#Each zone covers everything up to its threshold; the last block covers everything beyond zone 5's threshold.
#Zone 1 is closest to the water, zone 6 is furthest (dry land side).
[bank_zones]
	zone1Block = "minecraft:sand"
	# Default: -0.4
	# Range: -1.0 ~ 1.0
	zone1Threshold = -0.4
	zone2Block = "minecraft:gravel"
	# Default: -0.1
	# Range: -1.0 ~ 1.0
	zone2Threshold = -0.1
	zone3Block = "minecraft:mossy_cobblestone"
	# Default: 0.2
	# Range: -1.0 ~ 1.0
	zone3Threshold = 0.2
	zone4Block = "minecraft:podzol"
	# Default: 0.4
	# Range: -1.0 ~ 1.0
	zone4Threshold = 0.4
	zone5Block = "minecraft:cobblestone"
	# Default: 0.6
	# Range: -1.0 ~ 1.0
	zone5Threshold = 0.6
	zone6Block = "minecraft:grass_block"

#Fish (or other water_ambient mobs) to add to river water spawn pools,
#via a generated 'neoforge:add_spawns' biome modifier applied to the biomes
#listed under affectedBiomes below.
#Format: "entity_id;weight;minCount;maxCount" (vanilla river salmon: "minecraft:salmon;5;1;5").
#DownhillRivers automatically allows any entity registered with
#MobCategory.WATER_AMBIENT (vanilla or modded) to spawn in its river water block;
#this list controls which of those actually get added to spawn pools and how often.
[fish_spawning]
	fishSpawns = ["minecraft:salmon;5;1;5"]

#Biomes the river/bank surface rule applies to.
#Accepts biome IDs (e.g. 'minecraft:plains') or tags (e.g. '#minecraft:is_overworld').
[biomes]
	affectedBiomes = ["#minecraft:is_overworld"]
