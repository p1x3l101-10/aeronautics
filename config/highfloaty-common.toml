#Master toggle for the altitude-scaled gravity effect.
enabled = true
#Y coordinate at and below which gravity is fully vanilla (multiplier 1.0).
# Default: 200
# Range: -2048 ~ 4096
gravityStartY = 200
#Y coordinate at and above which gravity reaches its minimum multiplier.
# Default: 319
# Range: -2048 ~ 4096
gravityEndY = 319
#Minimum gravity multiplier reached at gravityEndY. 1.0 = vanilla, 0.5 = half gravity, 0.0 = zero gravity.
# Default: 0.5
# Range: 0.0 ~ 1.0
gravityMinMultiplier = 0.5
#Falloff shape between gravityStartY and gravityEndY.
#LINEAR: straight-line lerp from 1.0 to gravityMinMultiplier.
#EXPONENTIAL: stays near 1.0 most of the way, then falls sharply near the top.
#Allowed Values: LINEAR, EXPONENTIAL
curveMode = "LINEAR"
#If true and Sable is installed, applies altitude gravity scaling to airships and other Sable sub-levels.
#If your airships behave strangely, try setting this to false to disable Sable integration.
#Has no effect if Sable is not installed.
airshipScaling = true
