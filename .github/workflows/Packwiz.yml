name: Packwiz
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_packwiz_packs:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo GOBIN=/usr/local/bin go install github.com/packwiz/packwiz@latest
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
          lfs: true
      - uses: actions/checkout@v7
        with:
          ref: v6
          path: v6
          lfs: true
      - name: build main pack
        working-directory: main
        run: |
          bash -c "rm -rf $(cat .packwizignore | xargs)"
          /usr/local/bin/packwiz refresh --build
      - name: build v6
        working-directory: v6
        run: |
          bash -c "rm -rf $(cat .packwizignore | xargs)"
          /usr/local/bin/packwiz refresh --build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

          
  deploy:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build_packwiz_packs
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
